services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
    networks:
      - kullki-wasi-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://kullki_user:kullki_pass@db:5432/kullki_wasi_db
      - SECRET_KEY=kullki_wasi_security_token_secret_2026
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kullki-wasi-net

  db:
    image: postgres:15-alpine
    container_name: kullki-wasi-db
    environment:
      - POSTGRES_USER=kullki_user
      - POSTGRES_PASSWORD=kullki_pass
      - POSTGRES_DB=kullki_wasi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/kullkidb_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kullki_user -d kullki_wasi_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kullki-wasi-net

volumes:
  postgres_data:

networks:
  kullki-wasi-net:
    driver: bridge
